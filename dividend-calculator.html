<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071521">
  <meta name="description" content="輸入個人化投資參數，即時計算台股與美股 ETF 配息估算。">
  <title>配息試算｜投資工具</title>
  <style>
    :root{color-scheme:dark;--line:rgba(98,201,232,.23);--cyan:#8fe4ff;--muted:#91afbe;--green:#5de1a2;--sans:system-ui,-apple-system,"Segoe UI",sans-serif;--mono:ui-monospace,"Cascadia Mono",Consolas,monospace}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;background:radial-gradient(ellipse at top,#12334a 0,#071521 55%,#040b11 100%);color:#e8f9ff;font-family:var(--sans)}header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px max(18px,calc((100vw - 850px)/2));border-bottom:1px solid var(--line);background:rgba(5,20,31,.9)}header a{color:#bcefff;text-decoration:none}.brand{font-weight:900}.back{padding:9px 12px;border:1px solid rgba(143,228,255,.4);border-radius:9px}main{width:min(850px,calc(100% - 28px));margin:28px auto 50px}.card{padding:clamp(17px,4vw,28px);border:1px solid rgba(98,201,232,.36);border-radius:16px;background:linear-gradient(155deg,rgba(16,38,58,.96),rgba(7,21,33,.98) 68%)}h1{margin:0 0 8px;font-size:clamp(23px,5vw,30px)}.intro{margin:0 0 22px;color:var(--muted);font-size:14px;line-height:1.7}.switch,.freq{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 16px}.switch button,.freq button,form button{padding:10px 14px;border:1px solid rgba(98,201,232,.4);border-radius:8px;background:#102b3d;color:#bcefff;font:750 14px var(--sans);cursor:pointer}.switch button[aria-pressed=true],.freq button[aria-pressed=true]{border-color:var(--cyan);background:#17445a}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:7px;color:#a5c2cf;font-size:13px;font-weight:700}.field input{width:100%;min-width:0;padding:12px;border:1px solid #29495f;border-radius:9px;background:#071521;color:#e8f9ff;font:700 16px var(--mono)}.field input:focus{outline:2px solid #71d8f7}.result{margin-top:18px;padding:14px;border:1px solid var(--line);border-radius:10px;background:rgba(3,18,29,.72)}.result h2{margin:0 0 12px;color:var(--cyan);font-size:16px}.result-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.result-item{padding:10px;border-radius:8px;background:rgba(16,38,58,.7)}.result-item span{display:block;color:var(--muted);font-size:12px}.result-item strong{display:block;margin-top:5px;color:var(--green);font:800 18px var(--mono);overflow-wrap:anywhere}.notice{margin:15px 0 0;color:#789aaa;font-size:12px;line-height:1.7}@media(max-width:520px){header{padding:12px 14px}.grid,.result-grid{grid-template-columns:1fr}main{margin:18px auto 30px}}
  </style>
  <script src="dividend-calculator.js" defer></script>
</head>
<body>
  <header><a class="brand" href="./">投資工具</a><a class="back" href="./">← 返回首頁</a></header>
  <main><section class="card">
    <h1>🪙 配息試算</h1><p class="intro">以投入預算或持有股數，估算單次、月配與年配現金流。美股可調整預扣稅率及匯率。</p>
    <div class="switch" role="group" aria-label="市場"><button type="button" data-market="tw" aria-pressed="true">🇹🇼 台股</button><button type="button" data-market="us" aria-pressed="false">🇺🇸 美股</button></div>
    <div class="grid">
      <label class="field">投入預算（TWD）<input id="budget" type="number" min="0" step="any" value="100000"></label>
      <label class="field">ETF 股價（<span id="price-unit">TWD</span>）<input id="price" type="number" min="0" step="any" placeholder="例如 52.2"></label>
      <label class="field">每股單次配息（<span id="dividend-unit">TWD</span>）<input id="dividend" type="number" min="0" step="any" placeholder="例如 0.82"></label>
      <label class="field" id="fx-field" hidden>匯率（TWD / USD）<input id="fx" type="number" min="0" step="any" value="31.5"></label>
      <label class="field" id="tax-field" hidden>美股預扣稅率（%）<input id="tax" type="number" min="0" max="100" step="0.1" value="30"></label>
    </div>
    <div style="margin-top:16px"><div class="field" style="margin-bottom:8px">配息頻率</div><div class="freq" role="group" aria-label="配息頻率"><button type="button" data-frequency="monthly" aria-pressed="true">月配</button><button type="button" data-frequency="weekly" aria-pressed="false">週配</button><button type="button" data-frequency="quarterly" aria-pressed="false">季配</button><button type="button" data-frequency="annual" aria-pressed="false">年配</button></div></div>
    <section class="result" aria-live="polite"><h2>估算結果</h2><div class="result-grid"><div class="result-item"><span>可購買股數（整股）</span><strong id="shares">—</strong></div><div class="result-item"><span>實際投入</span><strong id="capital">—</strong></div><div class="result-item"><span>單次稅後配息</span><strong id="once">—</strong></div><div class="result-item"><span>月配息估算</span><strong id="monthly">—</strong></div><div class="result-item"><span>年配息估算</span><strong id="annual">—</strong></div><div class="result-item"><span>年化配息率（以實際投入）</span><strong id="yield">—</strong></div></div></section>
    <p class="notice">美股預扣稅率以使用者輸入值估算，預設 30%；實際稅率、退稅資格、匯率、交易費用與配息均可能不同。結果僅供試算，輸入不會保存。</p>
  </section></main>
</body>
</html>
